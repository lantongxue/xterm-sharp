<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071624">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.url == '/' %}{{ site.title }} | Pure C# terminal emulator for .NET{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/xtermsharp-mark.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }} | Pure C# terminal emulator for .NET{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/xtermsharp-social.png' | absolute_url }}">
    <script>
      (function () {
        var saved = localStorage.getItem('xtermsharp-theme');
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      }());
    </script>
  </head>
  <body class="layout-{{ page.layout }}" data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}

    <dialog class="search-dialog" data-search-dialog data-search-index="{{ '/search.json' | relative_url }}">
      <div class="search-heading">
        <div>
          <span class="eyebrow">Documentation</span>
          <h2>Search XtermSharp</h2>
        </div>
        <button type="button" class="dialog-close" aria-label="Close search" data-search-close>&times;</button>
      </div>
      <label for="site-search-input">Search guides, packages, and concepts</label>
      <input id="site-search-input" type="search" autocomplete="off" placeholder="Try snapshots, OSC 8, or Avalonia" data-search-input>
      <p class="search-status" aria-live="polite" data-search-status>Start typing to search the documentation.</p>
      <ul class="search-results" data-search-results></ul>
    </dialog>

    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
